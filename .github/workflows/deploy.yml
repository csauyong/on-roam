name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # the post pipeline calls this directly: a push made with GITHUB_TOKEN does
  # not trigger `on: push`, so it cannot rely on the branch event above.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # When called from post.yml or publish.yml the triggering event is an
          # `issues` one, so the default checkout is the SHA from before that
          # workflow committed its content. Always take the tip of main.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # For a project page, set SITE to https://<user>.github.io and BASE to /<repo>.
          SITE: ${{ vars.SITE_URL }}
          BASE: ${{ vars.BASE_PATH }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
